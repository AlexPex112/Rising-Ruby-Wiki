<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex — Rising Ruby Wiki</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <div class="nav-logo">Rising <span>Ruby</span> Wiki</div>
  <a href="index.html">Home</a>
  <a href="pokedex.html" class="active">Pokédex</a>
  <a href="routes.html">Routes</a>
  <a href="trainers.html">Trainers</a>
  <a href="items.html">Items</a>
  <a href="evolutions.html">Evolutions</a>
</nav>
<div class="container">
  <h1 class="page-title">Pokédex</h1>
  <div class="filter-bar">
    <input type="text" id="search" placeholder="Search by name or #number…" oninput="filterTable()">
    <select id="typeFilter" onchange="filterTable()">
      <option value="">All Types</option>
      <option>Normal</option><option>Fire</option><option>Water</option><option>Grass</option>
      <option>Electric</option><option>Ice</option><option>Fighting</option><option>Poison</option>
      <option>Ground</option><option>Flying</option><option>Psychic</option><option>Bug</option>
      <option>Rock</option><option>Ghost</option><option>Dragon</option><option>Dark</option>
      <option>Steel</option><option>Fairy</option>
    </select>
    <select id="rrFilter" onchange="filterTable()">
      <option value="">All Pokémon</option>
      <option value="rr">RR Changes Only</option>
    </select>
    <span id="count" style="color:var(--muted); font-size:0.85rem; margin-left:auto;"></span>
  </div>
  <div id="loadingMsg" class="loading">Loading Pokédex data…</div>
  <div id="errorMsg" class="error-msg" style="display:none"></div>
  <table class="pokedex-table" id="pokedexTable" style="display:none">
    <thead>
      <tr>
        <th class="num">#</th>
        <th class="sprite"></th>
        <th>Name</th>
        <th>Types</th>
        <th>Location in RR</th>
        <th>Abilities</th>
      </tr>
    </thead>
    <tbody id="pokedexBody"></tbody>
  </table>
</div>
<footer>Rising Ruby Wiki &mdash; fan-made &mdash; not affiliated with Nintendo or Game Freak.</footer>
<script src="js/pokedex.js"></script>
</body>
</html>
